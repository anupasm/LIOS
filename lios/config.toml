# ── Simulation / DES ──────────────────────────────────────────────────────────

[simulation]

# SGP4 orbital propagation time step (seconds)
time_step_sec = 30

# Global Poisson traffic arrival rate (flows per second).
# This does not scale with the number of ground nodes, satellites, or active
# ISL pairs, keeping offered load comparable across constellation sizes.
arrival_rate = 0.6

# Allocate each arrival uniformly across cross-operator satellite pairs that
# have an active ISL at the arrival time.
traffic_allocation = "uniform_active_pair"

# After sorting the selected pair by satellite ID, probability that traffic
# travels from the first satellite to the second. 0.5 is directionally unbiased.
traffic_direction_bias = 0.5

# Relative source-operator load. The global arrival_rate remains unchanged.
# Equal values preserve the existing uniform workload. For example,
# { op1 = 4.0, op2 = 1.0, op3 = 1.0, op4 = 1.0 } skews traffic toward op1.
operator_load_weights = { op1 = 1.0, op2 = 1.0, op3 = 1.0, op4 = 1.0 }

# Default PRNG seed for reproducible runs
random_seed = 42

# Adversarial node: probability of attacking each eligible forwarding event
p_attack = 0.5

# Traffic flow size bounds for the log-normal size distribution (KB)
# Lower clamp: minimum flow size.  10 KB = one small chunk.
flow_size_min_kb = 1024
# Upper clamp: must be ≤ channel_balance_kb or flows will always be dropped
# (satellite_node drops any flow where size_kb > current channel balance).
# 10_240 KB = 10 MB matches channel_balance_kb exactly.
flow_size_max_kb = 10_240

# ── Cryptographic PKI ──────────────────────────────────────────────────────────

[crypto]

# Default satellite certificate validity (days)
cert_valid_days = 90

# ── Hyperledger Fabric integration ─────────────────────────────────────────────

[blockchain]

# Path to the generated network config (relative to the lios/ source directory).
# Written by lios/evaluation/start_network.sh after the Fablo network starts.
network_config_path = "blockchain/network_config.json"

# On-chain operator channel balance per side (KB).  Set high enough to cover
# all satellite sub-channels across the experiment.  1 PB ≈ effectively unlimited.
operator_channel_balance_kb = 1_000_000_000.0

# Penalty reserve per operator per bilateral channel (KB).
operator_channel_reserve_kb = 10_000_000.0

# Simulated Fabric block-ordering + commit delay (seconds).
# Hyperledger Fabric consensus (Raft) + commit typically takes 1–3 s.
# Setting this > 0 ensures blockchain_sec reflects a realistic on-chain
# latency rather than the zero produced by the synchronous in-memory mock.
commit_latency_sec = 2.0
