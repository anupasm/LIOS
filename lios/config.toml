# LIOS Protocol Configuration
# All tunable constants in one place.  Edit here; no source changes needed.
#
# Loaded by lios/config.py (Python 3.11 tomllib — no extra dependencies).
# Override path via env var:  LIOS_CONFIG=/path/to/config.toml
#
# Section → typed dataclass in config.py:
#   [protocol]   → ProtocolConfig   (settlement rules, auth, channel sizing)
#   [link]       → LinkConfig       (RF / laser link physics and thresholds)
#   [simulation] → SimulationConfig (DES parameters, traffic shape, seeds)
#   [crypto]     → CryptoConfig     (PKI defaults)

# ── Protocol / settlement rules (§7, §11, §13) ────────────────────────────────

[protocol]

# T1 trigger: balance below this fraction of initial_capacity triggers settlement
t_low_fraction = 0.2           # 20 %

# T7 trigger: cumulative bytes forwarded in one session (KB).
# 3 MB ≈ 2× the median flow size (1 MB) so T7 fires after ~2 flows per channel.
s_max_kb = 30000

# On-chain challenge window after initiateSettlement() (seconds).
# Protocol spec: 48 h (172_800).  Reduced to 3 600 s (1 h) so the fallback
# CHALLENGE_WINDOW_EXPIRE path completes within the shortest simulation
# (baseline = 3 600 s).  The mutual-finalization path (both GS submit) makes
# this window irrelevant for honest runs; it only matters for adversarial tests.
t_challenge_sec = 3_600.0

# Deadline for top-up confirmation by counterpart GS (seconds).  24 h
t_topup_confirm_sec = 86_400.0

# Initial channel balance per side (KB).
# 10 MB for simulation (production would use 1 TB = 1_048_576 KB).
channel_balance_kb = 10_240

# Auth handshake: maximum clock skew between satellites (seconds)
timestamp_tolerance_sec = 30.0

# Auth handshake: ECDH nonce length (bytes)
nonce_bytes = 32

# ── Link / physical layer ──────────────────────────────────────────────────────

[link]

# Speed of light (km/s) — used for propagation delay calculation
c_km_s = 299_792.458

# Peak ISL laser capacity at zero separation (kbps)
isl_max_kbps = 10_000.0

# Peak GS uplink capacity at minimum elevation (kbps)
gs_max_kbps = 50_000.0

# Default maximum inter-satellite link range (km)
isl_max_range_km = 2500.0

# Default minimum ground-station elevation mask (degrees)
gs_min_elevation_deg = 5.0

# ── Simulation / DES ──────────────────────────────────────────────────────────

[simulation]

# SGP4 orbital propagation time step (seconds)
time_step_sec = 30

# Poisson traffic arrival rate (flows per second per ground-station node)
arrival_rate = 0.01

# Traffic generator contact-plan lookahead window (seconds)
lookahead_sec = 600.0

# Probability that a generated flow is cross-operator (vs same-operator)
cross_operator_bias = 0.7

# Default PRNG seed for reproducible runs
random_seed = 42

# Adversarial node: probability of attacking each eligible forwarding event
p_attack = 0.5

# Traffic flow size bounds for the log-normal size distribution (KB)
# Lower clamp: minimum flow size.  10 KB = one small chunk.
flow_size_min_kb = 10
# Upper clamp: maximum flow size.  200_000 KB = ~200 MB
flow_size_max_kb = 200000

# ── Cryptographic PKI ──────────────────────────────────────────────────────────

[crypto]

# Default satellite certificate validity (days)
cert_valid_days = 90

# ── Hyperledger Fabric integration ─────────────────────────────────────────────

[blockchain]

# Path to the generated network config (relative to the lios/ source directory).
# Written by lios/evaluation/start_network.sh after the Fablo network starts.
network_config_path = "blockchain/network_config.json"

# On-chain operator channel balance per side (KB).  Set high enough to cover
# all satellite sub-channels across the experiment.  1 PB ≈ effectively unlimited.
operator_channel_balance_kb = 1_000_000_000.0

# Penalty reserve per operator per bilateral channel (KB).
operator_channel_reserve_kb = 10_000_000.0

# Simulated Fabric block-ordering + commit delay (seconds).
# Hyperledger Fabric consensus (Raft) + commit typically takes 1–3 s.
# Setting this > 0 ensures blockchain_sec reflects a realistic on-chain
# latency rather than the zero produced by the synchronous in-memory mock.
commit_latency_sec = 2.0
