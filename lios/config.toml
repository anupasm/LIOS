# LIOS Protocol Configuration
# All tunable constants in one place.  Edit here; no source changes needed.
#
# Loaded by lios/config.py (Python 3.11 tomllib — no extra dependencies).
# Override path via env var:  LIOS_CONFIG=/path/to/config.toml
#
# Section → typed dataclass in config.py:
#   [protocol]   → ProtocolConfig   (settlement rules, auth, channel sizing)
#   [link]       → LinkConfig       (RF / laser link physics and thresholds)
#   [simulation] → SimulationConfig (DES parameters, traffic shape, seeds)
#   [crypto]     → CryptoConfig     (PKI defaults)

# ── Protocol / settlement rules (§7, §11, §13) ────────────────────────────────

[protocol]

# T1 trigger: balance below this fraction of initial_capacity triggers settlement
t_low_fraction = 0.2           # 20 %

# T7 trigger: cumulative bytes forwarded in one session (KB).
# Must be < channel_balance_kb × (1 − t_low_fraction) otherwise T1 always fires first.
# usable per side = 10_240 × 0.6 = 6_144 KB → s_max must be < 6_144 to be reachable.
# 4_915 KB ≈ 80% of usable balance → T7 fires after ~2–3 flows, before T1.
s_max_kb = 4_915

# On-chain challenge window after initiateSettlement() (seconds).
# Protocol spec: 48 h (172_800).  Reduced to 3 600 s (1 h) so the fallback
# CHALLENGE_WINDOW_EXPIRE path completes within the shortest simulation
# (baseline = 3 600 s).  The mutual-finalization path (both GS submit) makes
# this window irrelevant for honest runs; it only matters for adversarial tests.
t_challenge_sec = 3_600.0

# Deadline for top-up confirmation by counterpart GS (seconds).  24 h
t_topup_confirm_sec = 86_400.0

# Initial channel balance per side (KB).
# 10 MB for simulation (production would use 1 TB = 1_048_576 KB).
channel_balance_kb = 10_240

# Auth handshake: maximum clock skew between satellites (seconds)
timestamp_tolerance_sec = 30.0

# Auth handshake: ECDH nonce length (bytes)
nonce_bytes = 32

# ── Link / physical layer ──────────────────────────────────────────────────────

[link]

# Speed of light (km/s) — used for propagation delay calculation
c_km_s = 299_792.458

# Peak ISL laser capacity at zero separation (kbps)
isl_max_kbps = 10_000.0

# Peak GS uplink capacity at minimum elevation (kbps)
gs_max_kbps = 50_000.0

# Candidate-search maximum inter-satellite link range (km).  Operator-specific
# d_max gates below apply the final range rule; this value is the broad spatial
# index ceiling and CLI/cache tag.
isl_max_range_km = 4000.0

# Maximum simultaneous ISLs a satellite may hold (transceiver limit)
# 4 = 2 in-plane + 2 cross-plane, matching Starlink laser terminal design
max_isl_per_sat = 4

# Default minimum ground-station elevation mask (degrees)
gs_min_elevation_deg = 5.0

# Operator-wise ISL visibility profiles from
# isl_visibility_criteria_by_operator.html.  Ranges published as intervals are
# represented by their midpoint so each experiment has one reproducible value:
# Starlink 1000-2500 -> 1750 km, Telesat 3000-4000 -> 3500 km,
# Kuiper 2500-3500 -> 3000 km, OneWeb Gen-2 estimate -> 2500 km.
# For cross-operator links the calculator uses the stricter endpoint value for
# each gate, so averages are only computed over samples that already passed all
# instantaneous visibility criteria.
#
# fov/elevation convention: maximum absolute depression/elevation from the
# local horizontal tangent plane.  LEO crosslinks normally point slightly below
# the tangent plane, so this is the physically usable form of the HTML
# off-nadir/FOV gate for satellite-to-satellite links.
# link_* values are an equivalent Friis budget.  They are calibrated so the
# link-margin gate is explicit but does not exceed the listed operator d_max.
[link.operator_isl_criteria.default]
max_range_km = 1500.0
atmosphere_clearance_km = 80.0
max_tangent_depression_deg = 45.0
pointing_half_angle_deg = 45.0
max_radial_velocity_km_s = 4.0
min_contact_duration_sec = 2.0
carrier_frequency_ghz = 193000.0
eirp_dbw = 145.0
rx_gain_db = 145.0
receiver_sensitivity_dbw = -42.0

